server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # compress JS/CSS/JSON (the translation file is ~180 KB)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # never cache index.html, otherwise after a redeploy the browser keeps
  # an old index.html that points at JS files no longer in the image → blank page
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /locales/ {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}