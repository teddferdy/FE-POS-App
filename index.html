<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/mini-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <meta name="Bisa Nota - Demo" content="Bisa Nota - Demo" />
    <link rel="apple-touch-icon" href="/mini-logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Terapkan tema tersimpan SEBELUM React mount agar tidak ada flash (FOUC).
      // Baca dari localStorage yang sama dengan zustand persist "app-theme".
      try {
        var _t = JSON.parse(localStorage.getItem("app-theme") || "{}");
        if (_t.state && _t.state.theme === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <!-- ponytail: Inter kini self-host via @fontsource; ikon material tak dipakai halaman
         login — CSS-nya async agar tidak memblok LCP -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }
    </style>
    <title>Bisa Nota - Demo</title>
    <script>
      // ponytail: mulai fetch translasi SEJAJAR dengan entry JS — tanpa ini,
      // fetch baru jalan setelah i18n init (menunggu JS selesai parse+exec).
      // Baca bahasa dari sessionStorage yang sama dengan zustand persist.
      try {
        var t = JSON.parse(sessionStorage.getItem("translation") || "{}");
        var lng = (t.state && t.state.translation) || "id";
        var supported = ["en", "id", "jpn"];
        if (supported.indexOf(lng) === -1) lng = "id";
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "fetch";
        l.type = "application/json";
        l.href = "/locales/" + lng + "/translation.json";
        document.head.appendChild(l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
